<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title description">
  <title id="title">Example input validation result</title>
  <desc id="description">An illustration of an empty name producing the message: A nonempty name is required.</desc>
  <rect width="640" height="240" fill="#f8fafc"/>
  <rect x="24" y="24" width="592" height="192" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="64" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Input validation</text>
  <text x="48" y="98" font-family="sans-serif" font-size="15" fill="#475569">Example illustration</text>
  <rect x="48" y="120" width="544" height="64" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="68" y="159" font-family="sans-serif" font-size="20" fill="#991b1b">A nonempty name is required.</text>
</svg>
