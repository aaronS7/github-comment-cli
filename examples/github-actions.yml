# Example for this source repository. Copy into .github/workflows/ to enable.
# Replace the report step with your own Markdown report generation.
name: PR summary example

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: gh-comment-example-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Install CLI from this source checkout
        run: npm install --global .
      - name: Preview report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-comment post examples/summary.md --key example-summary --dry-run
      - name: Publish or update summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-comment post examples/summary.md --key example-summary
